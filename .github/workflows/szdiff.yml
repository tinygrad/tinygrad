name: Check Line Counts
on:
  pull_request_target:

# Cancel the workflow in progress in newer build is about to start.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checkbranch:
    name: Check PR Branch status
    runs-on: ubuntu-latest
    outputs:
      branchstat: ${{ steps.brstat.outputs.stat}}
    steps:
      - name: Check code from PR branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # PR code is only inspected with git rev-list, never executed
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Check whether branch is up-to-date
        id: brstat
        run: |
          git fetch origin master
          echo "${{ github.event.pull_request.head.sha }}"
          git rev-list --left-right --count origin/master...${{ github.event.pull_request.head.sha }} | awk '{print "Behind "$1" - Ahead "$2""}'
          count=$(git rev-list --left-right --count origin/master...${{ github.event.pull_request.head.sha }} | awk '{print $1}')
          if [ $count -gt 0 ]
          then
            echo "Current branch is behind master branch!"
            echo "stat=true" >> "$GITHUB_OUTPUT"
          else
            echo "stat=false" >> "$GITHUB_OUTPUT"
          fi

  szdiff:
    name: Core Library Line Difference
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    needs: checkbranch
    if: needs.checkbranch.outputs.branchstat == 'false'
    steps:
      - name: Checkout code from PR branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          # PR code is only line-counted by master's sz.py, never executed
          allow-unsafe-pr-checkout: true
          persist-credentials: false
        # the base default to tinygrad master and cannot be other fork branch for security purpose
      - name: Checkout code from tinygrad master
        uses: actions/checkout@v6
        with:
          path: base
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Count Line Diff
        run: |
          BASE="$GITHUB_WORKSPACE/base"
          PR="$GITHUB_WORKSPACE/pr"
          pip install tabulate $BASE
          cp "$BASE/sz.py" .
          python sz.py "$BASE" "$PR" > loc_content.txt
      - name: Comment Code Line Diff
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments"
          BODY=$(python3 -c "import json; print(json.dumps(open('loc_content.txt').read()))")
          # find existing sticky comment (contains "### Changes")
          EXISTING_ID=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" "$API" \
            | python3 -c "import sys,json; cs=json.load(sys.stdin); print(next((c['id'] for c in cs if '### Changes' in c.get('body','')), ''))")
          if [ -n "$EXISTING_ID" ]; then
            curl -sf -X PATCH -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/comments/$EXISTING_ID" \
              -d "{\"body\": $BODY}"
          else
            curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
              "$API" -d "{\"body\": $BODY}"
          fi

  rebase:
    name: Core Library Line Difference
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    needs: checkbranch
    if: needs.checkbranch.outputs.branchstat == 'true'
    steps:
      - name: Comment Rebase
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          API="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments"
          MSG="This branch currently is behind master. The line count difference bot is disabled."
          BODY=$(python3 -c "import json; print(json.dumps('''$MSG'''))")
          # find existing sticky comment (contains "line count difference bot is disabled")
          EXISTING_ID=$(curl -sf -H "Authorization: token $GITHUB_TOKEN" "$API" \
            | python3 -c "import sys,json; cs=json.load(sys.stdin); print(next((c['id'] for c in cs if 'line count difference bot is disabled' in c.get('body','')), ''))")
          if [ -n "$EXISTING_ID" ]; then
            curl -sf -X PATCH -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/comments/$EXISTING_ID" \
              -d "{\"body\": $BODY}"
          else
            curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" \
              "$API" -d "{\"body\": $BODY}"
          fi
