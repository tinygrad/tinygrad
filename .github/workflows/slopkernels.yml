name: slopkernels

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: slopkernels-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline UIR & Purity
    runs-on: &linux ${{ github.repository == 'tinygrad/tinygrad' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.author_association == 'COLLABORATOR')) && 'turin' || 'ubuntu-24.04' }}
    timeout-minutes: 3
    defaults:
      run:
        shell: bash -e -o pipefail {0}
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: pip install -q pytest numpy
    - name: Compile all slopkernels offline to UIR
      run: DEV=NULL python3 -m slopkernels /tmp/slopkernels_uir
    - name: API purity & offline UIR tests
      run: DEV=NULL python3 -m pytest slopkernels/test/test_slopkernels.py -k "boundary or compile_all" -v

  mock:
    name: Mock AMD (${{ matrix.arch }})
    runs-on: *linux
    strategy:
      fail-fast: false
      matrix:
        arch: ['gfx1100', 'gfx1201']
    timeout-minutes: 3
    defaults:
      run:
        shell: bash -e -o pipefail {0}
    env:
      DEV: MOCKKFD+AMD::${{ matrix.arch }}
      PARALLEL: "0"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install test dependencies & AMD comgr
      run: |
        pip install -q pytest pytest-xdist numpy gguf
        if ! dpkg-query -W -f='${db:Status-Abbrev}' comgr 2>/dev/null | grep -q '^ii'; then
          sudo mkdir -p /etc/apt/keyrings
          wget -qO- https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/7.1 $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null
          sudo apt-get -qq update && sudo apt-get -y --no-install-recommends install comgr
        fi
        printf '/opt/rocm/lib\n/opt/rocm/lib64\n' | sudo tee /etc/ld.so.conf.d/rocm.conf >/dev/null
        sudo ldconfig
    - name: Run slopkernels tests
      run: python3 -m pytest slopkernels/test/ -n=auto -q --durations=10

  gpu:
    name: Tests & Benchmarks (${{ matrix.runner }})
    if: github.repository != 'tinygrad/tinygrad' || github.event_name == 'push' || github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ['7900xtx', '9060xt']
    timeout-minutes: 3
    defaults:
      run:
        shell: bash -e -o pipefail {0}
    env:
      DEV: AMD
      PARALLEL: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Setup (AMD)
      run: AM_RESET=1 python3 -c 'from tinygrad import Device; Device[Device.DEFAULT]'
    - name: Run real-GPU correctness tests
      run: >-
        python3 -m pytest slopkernels/test/test_slopkernels.py slopkernels/test/test_amd_llm.py -k
        "test_logical_op_uirs_execute_exact or test_f16_wmma_lds_and_small_tile or
        test_wmma_dequantization_basis or test_quant_linear_decode_row_groups or
        test_moe_decode_iq1_s or test_moe_decode_mxfp4 or test_gated_delta_random_scan or
        test_flash_attention_decode_symbolic_gqa or test_prefill_attention_random" -q --durations=10
    - name: Benchmark LLM ops (GGUF GEMV, GGUF GEMM, MoE, Attention)
      run: python3 -m slopkernels.bench --fast --warmup 2 --iters 5
