repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python3 -m ruff check .
        language: system
        always_run: true
        pass_filenames: false
      - id: tiny
        name: tiny tests
        entry: python3 -m pytest test/test_tiny.py
        language: system
        always_run: true
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python3 -m mypy
        language: system
        always_run: true
        pass_filenames: false
      - id: tests
        name: all-device and comprehensive tests
        entry: >-
          env OMP_NUM_THREADS=1 SKIP_SLOW_TEST=1 python3 -m pytest -n auto --maxprocesses=12 --dist=worksteal
          test/external/external_test_example.py test/runtime/test_ops.py test/runtime/test_schedule.py
          test/runtime/test_assign.py test/runtime/test_tensor.py test/runtime/test_jit.py test/runtime/test_schedule_cache.py
          test/null/test_pattern_matcher.py test/null/test_uop_symbolic.py test/runtime/test_helpers.py
        language: system
        always_run: true
        pass_filenames: false
